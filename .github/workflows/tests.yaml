name: tests
on:
  push:
    branches:
      - main

jobs:
  test-atari-envs:
    runs-on: ${{ matrix.os }}
    steps:
      - name: Start Energy Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@862050e4f01f65b1436e5eca18ba4bd85562f0de
        with:
          json-output: true
          task: start-measurement
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - run: uv venv
      - id: measurement-5
        name: Record Measurement After Step
        uses: green-coding-solutions/eco-ci-energy-estimation@862050e4f01f65b1436e5eca18ba4bd85562f0de
        with:
          json-output: true
          label: Step
          task: get-measurement
      - name: Install atari dependencies
        run: uv pip install ".[pytest, atari]"
      - id: measurement-7
        name: Record Measurement After Install atari dependencies
        uses: green-coding-solutions/eco-ci-energy-estimation@862050e4f01f65b1436e5eca18ba4bd85562f0de
        with:
          json-output: true
          label: Install atari dependencies
          task: get-measurement
      - name: Run atari tests
        run: uv run pytest tests/test_atari.py
      - id: measurement-9
        name: Record Measurement After Run atari tests
        uses: green-coding-solutions/eco-ci-energy-estimation@862050e4f01f65b1436e5eca18ba4bd85562f0de
        with:
          json-output: true
          label: Run atari tests
          task: get-measurement
      - if: runner.os == 'Linux' || runner.os == 'macOS'
        name: Install jax
        run: uv pip install ".[pytest, atari, jax]"
      - id: measurement-11
        name: Record Measurement After Install jax
        uses: green-coding-solutions/eco-ci-energy-estimation@862050e4f01f65b1436e5eca18ba4bd85562f0de
        with:
          json-output: true
          label: Install jax
          task: get-measurement
      - name: Run gymnasium migration dependencies
        run: uv run pip install "gymnasium[atari,accept-rom-license]==0.28.1" "ale-py==0.8.1"
      - id: measurement-13
        name: Record Measurement After Run gymnasium migration dependencies
        uses: green-coding-solutions/eco-ci-energy-estimation@862050e4f01f65b1436e5eca18ba4bd85562f0de
        with:
          json-output: true
          label: Run gymnasium migration dependencies
          task: get-measurement
      - name: Run gymnasium tests
        run: uv run pytest tests/test_atari_gymnasium.py
      - id: measurement-15
        name: Record Measurement After Run gymnasium tests
        uses: green-coding-solutions/eco-ci-energy-estimation@862050e4f01f65b1436e5eca18ba4bd85562f0de
        with:
          json-output: true
          label: Run gymnasium tests
          task: get-measurement
      - if: runner.os == 'Linux' || runner.os == 'macOS'
        name: Run gymnasium tests with jax
        run: uv run pytest tests/test_atari_jax_gymnasium.py
      - id: measurement-17
        name: Record Measurement After Run gymnasium tests with jax
        uses: green-coding-solutions/eco-ci-energy-estimation@862050e4f01f65b1436e5eca18ba4bd85562f0de
        with:
          json-output: true
          label: Run gymnasium tests with jax
          task: get-measurement
      - id: display-measurement
        name: Display Energy Results
        uses: green-coding-solutions/eco-ci-energy-estimation@862050e4f01f65b1436e5eca18ba4bd85562f0de
        with:
          json-output: true
          task: display-results
      - name: Save Total Energy Consumption Data
        run: echo '${{ steps.final-measurement.outputs.data-total-json }}' > total_energy_consumption.json
      - name: Upload Energy Consumption Artifact
        uses: actions/upload-artifact@v4
        with:
          name: total-energy-consumption
          path: total_energy_consumption.json
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
        python-version:
          - '3.8'
          - '3.9'
          - '3.10'
