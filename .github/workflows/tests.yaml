          task: get-measurement
      - name: Setup virtual display
        run: 'sudo apt-get update

          sudo apt-get install -y xvfb

          export DISPLAY=:99

          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &

          '
      - id: measurement-7
